[pytest]
# Les dossiers solution/ sont des copies autonomes du chapitre : on ne les
# ramasse pas quand on teste le chapitre lui-même. Pour les tester :
#     pytest chapitre-01-premier-agent/solution
norecursedirs = solution .venv .git

# Chaque chapitre est autonome et possède ses propres agent.py et
# outils.py. Deux chapitres ne peuvent donc pas être testés dans le
# même processus Python : le second importerait l'agent du premier.
# C'est pourquoi il n'y a pas de testpaths couvrant les chapitres —
# le lancement global passe par `python verifier.py`, qui donne un
# processus à chacun.
#
# Ce fichier ne sert qu'aux lancements ciblés :
#     pytest chapitre-01-premier-agent/
#     pytest livre/

# Le mode d'import reste celui par défaut (« prepend ») : c'est lui
# qui met le dossier tests/ sur le chemin, et donc qui rend
# `from doublures import FauxClient` possible dans les tests.

# pytest-asyncio sous Python 3.14 crache des milliers de
# DeprecationWarning qui noient les vrais messages.
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
